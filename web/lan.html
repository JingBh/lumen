<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lumen</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="kit.css">
  <style>
    html { background: var(--bg); overscroll-behavior: none; }
    /* No double-tap zoom (pinching is stopped in lan.js): on every element, since a scrolling box does not look past
       itself, and as manipulation, the one value besides none that Safari reads as that. */
    * { touch-action: manipulation; }
    /* The height of what is in view (see lan.js): iOS Safari counts its toolbars into 100vh and into a fixed box. The
       page itself never moves, which on iOS takes pinning it: overflow alone still lets it be dragged and bounce. */
    body { position: fixed; inset: 0 0 auto; }
    body, .lm-window { height: var(--view-h, 100dvh); }
    .lm-window { bottom: auto; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="vendor/json-render-core.js"></script>
  <script src="ui.js"></script>
  <script src="kit.js"></script>
  <script src="lan.js"></script>
</body>
</html>
